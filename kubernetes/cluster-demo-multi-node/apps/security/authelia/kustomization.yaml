---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../../external/business-operations/kubernetes/apps/security/authelia

patches:
  - target:
      kind: Kustomization
      group: kustomize.toolkit.fluxcd.io
      name: cluster-apps-authelia
    patch: |
      - op: replace
        path: /spec/path
        value: ./kubernetes/cluster-demo/apps/security/authelia/app
