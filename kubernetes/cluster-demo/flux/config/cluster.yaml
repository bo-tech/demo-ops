---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: bv-ops-kubernetes
  namespace: flux-system
spec:
  interval: 30m
  recurseSubmodules: true
  ref:
    branch: main
  url: http://gitea-http.flux-bootstrap.svc.cluster.local/bootstrap/b-ops.git
  ignore: |
    # exclude all
    /*
    # include gitops dirs
    !/kubernetes
    !/external/business-operations/kubernetes
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster
  namespace: flux-system
spec:
  interval: 30m
  path: ./kubernetes/${cluster_name}/flux
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: bv-ops-kubernetes
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: flux
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: Secret
        name: secret-cluster-settings
